<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Tic Tac Toe</title>
            <link rel="icon" href="TicTacToe.png" type="image/x-icon">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
            <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
            <link rel="stylesheet" href="tictactoe.css">

    </head>
    <body>
        <header>
            <h1>Tic Tac Toe</h1>
        </header>

        <main>
            <div class="controls" id="controls">
                <div class="player-selectors">
                    <fieldset class="player-selector">
                        <legend>Player 1</legend>
                        <label for="player1Name">Name</label>
                        <input type="text" id="player1Name" name="player1Name" value="Player 1">

                        <span class="field-label">Type</span>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="player1Type" value="Human" checked>
                                <span>Human</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="player1Type" value="AI">
                                <span>AI</span>
                            </label>
                        </div>

                        <label for="player1Mark">Mark</label>
                        <input type="text" id="player1Mark" name="player1Mark" value="X" maxlength="1">
                    </fieldset>

                    <fieldset class="player-selector">
                        <legend>Player 2</legend>
                        <label for="player2Name">Name</label>
                        <input type="text" id="player2Name" name="player2Name" value="Player 2">

                        <span class="field-label">Type</span>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="player2Type" value="Human" checked>
                                <span>Human</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="player2Type" value="AI">
                                <span>AI</span>
                            </label>
                        </div>

                        <label for="player2Mark">Mark</label>
                        <input type="text" id="player2Mark" name="player2Mark" value="O" maxlength="1">
                    </fieldset>
                </div>
                <button id="Start">Start</button>
            </div>

            <div>
                <h2 id="message">Start game to play</h2>
                <div class="board">
                </div>
            </div>
        </main>
        

        <footer>
            <p>&copy; 2026 Tic Tac Toe Game: YaakoviCorp</p>
        </footer>

        <script src="tictactoe.js"></script>
    </body>
</html>
